name: keepalive

# Pings both Render free-tier services' health endpoints often enough that
# neither hits Render's ~15-minute inactivity spin-down -- a cold start
# after spin-down costs 40-50s+ (same pattern documented in Rakshak-AI's own
# .github/workflows/keep-alive.yml, built for the same reason). Real,
# confirmed-live URLs, not guessed:
#   - prahari-backend (prahari_dashboard_backend/app/main.py) ->
#     https://prahari-backend-55aq.onrender.com/api/health (note: /health
#     404s on this service -- confirmed directly via curl; the real route
#     is under /api)
#   - rakshak-webhook (webhook.app) -> https://rakshak-webhook.onrender.com/health
#     -- kept warm here too because AppSettings.kt's DEFAULT_EVIDENCE_BASE_URL
#     now points the Android app's screenshot-OCR path (/ocr/tesseract) at
#     this exact service.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: prahari-backend
            url: https://prahari-backend-55aq.onrender.com/api/health
          - name: rakshak-webhook
            url: https://rakshak-webhook.onrender.com/health
    steps:
      - name: Ping ${{ matrix.service.name }}
        run: |
          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 90 "${{ matrix.service.url }}")
          echo "status=$code"
          cat /tmp/body.txt
          echo
          if [ "$code" != "200" ]; then
            echo "::error::${{ matrix.service.name }} returned HTTP $code, expected 200"
            exit 1
          fi
